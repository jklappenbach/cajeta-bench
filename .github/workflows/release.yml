name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Builds + tests the library on a main push; on a v* tag also publishes a
# GitHub Release and a signed publish to Olla. Logic lives in the reusable
# workflow. No `pull_request:` trigger by design — changes land by pushing
# straight to main, so a PR trigger would never fire.
jobs:
  # Releases are cut from `release` only (main is the conduit, `release` is the
  # train). lib-release.yml publishes on a v* tag and nothing else, so a branch
  # push or a dispatch passes; a tag whose commit is not on `release` is refused.
  # Same check as the cajeta compiler's release workflow. To release:
  #   git push origin <sha>:refs/heads/release   (fast-forward only)
  #   git tag v<version> <sha> && git push origin v<version>
  guard:
    name: release branch guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must be on the release branch
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=release
          if [ "${REF#refs/tags/}" = "$REF" ]; then
            echo "::notice::'$REF_NAME' is not a tag — publishes nothing, guard not applied"
            exit 0
          fi
          if ! git fetch --no-tags origin \
                 "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null; then
            echo "::error::there is no '$BRANCH' branch on origin. Releases are cut" \
                 "from it and only from it."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" "origin/$BRANCH"; then
            echo "::error::tag '$REF_NAME' points at $SHA, which is NOT on '$BRANCH'." \
                 "Nothing ships from a tag that is only on main. Fast-forward" \
                 "'$BRANCH' to the commit you mean to release, push it, then move the tag."
            exit 1
          fi
          echo "::notice::tag '$REF_NAME' is on '$BRANCH' — guard satisfied"

  release:
    needs: [guard]
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # Pin explicitly; omitting this inherits the reusable workflow's default.
      # 0.1.0 was authored and tested on v0.46.3. v0.53.1: 91 passed, 0
      # failed, 2 skipped, and every verify-fidelity case, 2026-11-08.
      cajeta-version: v0.53.1
      # The cajeta-unit suite (run-tests.sh resolves dev.cajeta.unit itself:
      # sibling checkout, else $OLLA_HOME, else a sha256-verified Olla fetch)
      # and the verify-fidelity fixture tests.
      test-command: ./scripts/ci-checks.sh
    secrets: inherit
